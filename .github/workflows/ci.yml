name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Lint is advisory until the existing 143 errors are burned down (Phase 5 makes it blocking).
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
