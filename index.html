<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sportsbnb" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="canonical" href="https://www.sportsbnb.org/" data-rh="true" />
    <title>Sportsbnb — Book Sports Venues &amp; Join Games Near You</title>
    <meta name="description" content="Find and book sports venues near you — courts, fields and pools. Join open games, create teams, and play with your community." data-rh="true">
    <meta name="author" content="Sportsbnb" />
    <meta name="keywords" content="sports venue booking, book basketball court, rent football field, tennis court reservation, sports facility near me, join pickup games, find players, team sports booking, court rental, sports community" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:url" content="https://www.sportsbnb.org/" data-rh="true" />
    <meta property="og:image" content="https://www.sportsbnb.org/og-image.png" data-rh="true">
    <meta property="og:site_name" content="Sportsbnb" data-rh="true" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:image" content="https://www.sportsbnb.org/og-image.png" data-rh="true">

    <!-- Additional SEO -->
    <meta name="google-site-verification" content="wtHt7QCsQv1FdG70bEAZwMEE8DoVnEEpmeBoy1DoOFs" />
    <meta name="theme-color" content="#f9f8f3" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- JSON-LD Structured Data -->
    <!--
      The fallback structured data, for a crawler that does not execute
      JavaScript. It is duplicated by SEOHead on the client, and that is
      deliberate: this is the only copy an AI crawler ever sees, because
      react-helmet-async writes its tags after React mounts and GPTBot,
      ClaudeBot and PerplexityBot do not run React.

      Keep it in step with createWebsiteJsonLd in src/components/seo/SEOHead.tsx.
      scripts/crawlable.mjs fails the build if the two disagree about the site
      name, the host, or the search URL.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.sportsbnb.org/#website",
          "name": "Sportsbnb",
          "url": "https://www.sportsbnb.org/",
          "publisher": { "@id": "https://www.sportsbnb.org/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.sportsbnb.org/venues?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.sportsbnb.org/#organization",
          "name": "Sportsbnb",
          "url": "https://www.sportsbnb.org/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.sportsbnb.org/favicon.png"
          },
          "description": "Sportsbnb is a sports venue booking marketplace in Armenia. Players find and book courts, pitches and pools by the hour and pay in the app; venue owners list their facilities and manage bookings.",
          "areaServed": [
            { "@type": "Country", "name": "Armenia" },
            { "@type": "AdministrativeArea", "name": "Yerevan" }
          ]
        },
        {
          "@type": "WebApplication",
          "name": "Sportsbnb",
          "url": "https://www.sportsbnb.org/",
          "description": "Find and book sports venues, join open games, and connect with players near you.",
          "applicationCategory": "SportsApplication",
          "operatingSystem": "Web",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AMD" }
        }
      ]
    }
    </script>
    <meta property="og:title" content="Sportsbnb — Book Sports Venues &amp; Join Games Near You" data-rh="true">
  <meta name="twitter:title" content="Sportsbnb — Book Sports Venues &amp; Join Games Near You" data-rh="true">
  <meta property="og:description" content="Find and book sports venues near you — courts, fields and pools. Join open games, create teams, and play with your community." data-rh="true">
  <meta name="twitter:description" content="Find and book sports venues near you — courts, fields and pools. Join open games, create teams, and play with your community." data-rh="true">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
