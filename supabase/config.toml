# Auth posture
# ------------
# Default (unlisted) and verify_jwt = true: the gateway rejects requests without
# a valid user JWT. Functions still do their own authorization in-code
# (requireUser/requireAdmin from _shared/auth.ts) as defense in depth.
#
# verify_jwt = false is reserved for machine-invoked endpoints, which MUST
# enforce their own verification in-code:
#   - cron/internal: requireCronSecret (x-cron-secret header or service-role bearer)
#   - webhooks: provider signature verification (Svix for Resend, secret token for Telegram)
#   - deliberately public, read-only or rate-limited: widget-data, send-contact-email,
#     get-weather, geosuggest

# --- User-facing (JWT required at the gateway) ---

[functions.ai-chat]
verify_jwt = true

